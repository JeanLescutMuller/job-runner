# ~/opt/job-runner/dashboard/conf/_default.conf on the VM: every key the dashboard knows, with its default (DESIGN §11).
# Overridden by <repo>.conf, then by <repo>.<job>.conf; KEY@<machine>=value applies to that machine only.

# Thresholds
RED_AFTER_MIN=1560          # red: no SUCCESS on any machine for this long (26 h)
RED_AFTER_FAILURES=3        # red: this many FAILUREs in a row (orange from the first)
SILENT_AFTER_MIN=1560       # grey: this machine wrote no status for this job for this long
SILENT_AFTER_MIN@chan-lescut-macbook-pro=2880   # the Mac sleeps for days

# Alert (~/dev/agents/tasks)
ALERT=minor-within_a_day    # a red job: a task through `task`, as <cost_if_undone>-<complete_by> (task --help); off: none
# Why that cost and that deadline (`task` requires both, the user, 2026-10-28); a conf that changes ALERT changes them too
ALERT_WHY_COST=while red the job does not do its work; most jobs are conveniences, a day of it costs under 100 CHF
ALERT_WHY_BY=a red job stays broken until fixed and each day misses another run; one day late is still cheap

# Display
TITLE=                      # empty: the job's name
GROUP=                      # empty: the repo; jobs of one group are shown together
ORDER=50                    # smaller first, within the page
HISTORY=20                  # checks shown in the job's history
FOLD=SKIP                   # statuses folded into a count in the history (space-separated)
DECOMMISSIONED=0            # 1: folded at the bottom, no red, no grey
