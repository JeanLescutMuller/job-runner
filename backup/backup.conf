# The dashboard's settings of job-runner.backup (DESIGN §11), sent to the VM by install.sh on the NAS (put-conf.sh).
TITLE=NAS backup (restic, portable disk)
RED_AFTER_MIN=11520         # weekly: red after 8 days with no success
RED_AFTER_FAILURES=1        # one failed week is already a week without a backup
SILENT_AFTER_MIN=11520      # one check a week: grey only after 8 days without one
